<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Livraria Maria</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Estilos internos para o admin (pode mover para style.css se quiser) */
        body { background:#f5f7fa; font-family: Arial, sans-serif; margin:0; padding:20px; }
        .admin-container { max-width:1200px; margin:0 auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.08); }
        h1 { text-align:center; margin-bottom:10px; }
        .controls { display:flex; gap:12px; align-items:center; margin:12px 0 18px; flex-wrap:wrap; }
        .controls input[type="text"], .controls input[type="number"] { padding:8px 10px; border-radius:6px; border:1px solid #ccc; }
        .controls button { padding:9px 14px; border:none; border-radius:6px; cursor:pointer; background:#4A148C; color:#fff; }
        .btn-add { background:#2E7D32; }
        table { width:100%; border-collapse:collapse; margin-top:12px; }
        th, td { padding:12px 8px; border-bottom:1px solid #eee; text-align:left; }
        th { background:#fafafa; }
        .actions button { margin-right:6px; }
        .btn-edit { background:#1976D2; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
        .btn-delete { background:#D32F2F; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
        #graficos-container { margin-top:26px; display:flex; gap:20px; flex-wrap:wrap; }
        canvas { background:#fff; padding:8px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.04); }
        /* Modal */
        .modal { position:fixed; inset:0; display:none; justify-content:center; align-items:center; background:rgba(0,0,0,0.4); }
        .modal-content { background:#fff; padding:20px; border-radius:10px; width:360px; max-width:90%; }
        .modal-content input { width:100%; padding:8px; margin:8px 0; border-radius:6px; border:1px solid #ccc; }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
        .modal-actions button { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; }
        .btn-save { background:#2E7D32; color:#fff; }
        .btn-cancel { background:#9e9e9e; color:#fff; }
        @media(max-width:720px){ .controls { flex-direction:column; align-items:stretch; } #graficos-container { flex-direction:column; } }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Painel Administrativo — Livraria Maria</h1>

        <div class="controls">
            <input type="text" id="buscaInput" placeholder="Buscar produto por nome...">
            <input type="number" id="precoMin" placeholder="Preço mín.">
            <input type="number" id="precoMax" placeholder="Preço máx.">
            <button id="btnFiltrar">Aplicar Filtro</button>
            <button id="btnOpenModal" class="btn-add">+ Adicionar Produto</button>
            <button id="btnReset" title="Resetar produtos para padrão">Reset Padrão</button>
        </div>

        <table aria-label="Tabela de produtos">
            <thead>
                <tr>
                    <th style="width:6%;">ID</th>
                    <th>Nome</th>
                    <th style="width:14%;">Preço (R$)</th>
                    <th style="width:20%;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>

        <div id="graficos-container" style="margin-top: 30px;">
            <h3>Distribuição de Preços</h3>
            <canvas id="graficoPizza" height="250"></canvas>
        </div>

    </div>

    <!-- Modal para adicionar/editar -->
    <div class="modal" id="modalProduto" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h3 id="modalTitulo">Adicionar Produto</h3>
            <input id="inputNome" placeholder="Nome do livro" type="text">
            <input id="inputPreco" placeholder="Preço (ex: 39.90)" type="number" step="0.01" min="0">
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancelar">Cancelar</button>
                <button class="btn-save" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
